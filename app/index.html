<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpettacolApp · Spettacolando Eventi</title>
<meta name="description" content="L'app dei ragazzi di Spettacolando: tocca qui per aprirla">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Spettacolando Eventi">
<meta property="og:title" content="📱 SpettacolApp · L'app dei ragazzi">
<meta property="og:description" content="ASD Spettacolando Eventi APS · Tocca qui per aprirla">
<meta property="og:url" content="https://spettacolando-iscriviti.netlify.app/app/">
<meta property="og:image" content="https://spettacolando-iscriviti.netlify.app/app/anteprima.jpg">
<meta property="og:image:secure_url" content="https://spettacolando-iscriviti.netlify.app/app/anteprima.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="logo.jpg">
<style>
  :root{--viola:#7a2a8f;--viola-scuro:#46145a;--oro:#c8ab63;--testo:#231b2b;--grigio:#6c6177;--bordo:#ddd3e6;--sfondo:#f7f4fa}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--sfondo);color:var(--testo);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
  header{background:var(--viola);color:#fff;text-align:center;padding:22px 16px 24px}
  header img{width:110px;height:110px;border-radius:50%;background:#fff;object-fit:contain;border:3px solid var(--oro)}
  header h1{margin:10px 0 0;font-size:24px}
  main{max-width:460px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:14px}
  .card{background:#fff;border:1px solid var(--bordo);border-radius:14px;padding:16px}
  label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
  input{width:100%;padding:12px;border:1.5px solid var(--bordo);border-radius:10px;font-size:16px;font-family:inherit}
  input:focus{outline:2px solid var(--viola);border-color:var(--viola)}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font:700 17px inherit;font-family:inherit;cursor:pointer;background:var(--viola);color:#fff;text-align:center;text-decoration:none}
  .btn.chiaro{background:transparent;color:var(--viola);border:1.5px solid var(--bordo);font-weight:600}
  .nota{font-size:13px;color:var(--grigio);margin:8px 0 0}
  .stato{font-weight:600;font-size:15px}
  .ok{color:#1f7a46}.err{color:#b3261e}
  .chi{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .chi button{border:0;background:none;color:var(--viola);font:600 14px inherit;font-family:inherit;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<header>
  <img src="logo.jpg" alt="Spettacolando Eventi">
  <h1>SpettacolApp</h1>
</header>
<main>
  <!-- primo accesso: nome + consenso (una volta sola) -->
  <div id="primo" hidden style="display:grid;gap:14px">
    <div class="card">
      <label for="nome">Nome e cognome</label>
      <input id="nome" autocomplete="name" placeholder="es. Filippo Scutiero">
    </div>
    <div class="card">
      <label class="chk" style="display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px;margin:0"><input type="checkbox" id="ok" style="width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--viola)"><span>Acconsento a condividere con l'ASD Spettacolando Eventi APS la mia posizione ogni volta che apro SpettacolApp. Serve a coordinare le attività istituzionali, a indicarmi il luogo dove recarmi e a dire ai clienti quando arriviamo. Il consenso vale per tutti gli accessi successivi e posso revocarlo chiedendo alla presidente.</span></label>
    </div>
    <button type="button" class="btn" id="accetta">Accetto e apro l'app</button>
  </div>

  <!-- accessi successivi -->
  <div class="card chi" id="boxChi" hidden><span>Ciao <b id="chiNome"></b>!</span><button type="button" id="cambia">Non sei tu?</button></div>
  <p class="stato" id="stato" aria-live="polite"></p>
  <button type="button" class="btn" id="riprova" hidden>Riprova</button>
  <p class="nota" id="aiuto" hidden>Per usare SpettacolApp serve la posizione. Se l'hai negata: tocca il lucchetto (o "Aa") accanto all'indirizzo in alto → Posizione → Consenti, poi tocca Riprova. Controlla anche che il GPS del telefono sia acceso.</p>
</main>
<script>
const APP="https://claude.ai/artifact/SZwxAJSfm4btNnBbM7hbdf#semplice";
const $=id=>document.getElementById(id);
const leggi=k=>{ try{ return localStorage.getItem(k)||""; }catch(e){ return ""; } };
const scrivi=(k,v)=>{ try{ v===null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} };
let nome=leggi("spt_nome"), consenso=leggi("spt_consenso");
function stato(t,cls){ const s=$("stato"); s.textContent=t; s.className="stato "+(cls||""); }
function mostra(){ const primo=!(nome&&consenso); $("primo").hidden=!primo; $("primo").style.display=primo?"grid":"none"; $("boxChi").hidden=primo; $("chiNome").textContent=nome; }
$("cambia").onclick=()=>{ nome=""; consenso=""; scrivi("spt_nome",null); scrivi("spt_consenso",null); $("riprova").hidden=true; $("aiuto").hidden=true; stato(""); mostra(); $("nome").focus(); };
function invia(primaVolta){
  if(!navigator.geolocation){ stato("Questo telefono non permette di inviare la posizione: apri il link con Chrome o Safari.","err"); return; }
  $("riprova").hidden=true; $("aiuto").hidden=true; stato("Cerco la tua posizione…");
  navigator.geolocation.getCurrentPosition(async p=>{
    try{
      const r=await fetch("/api/posizioni",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nome,lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,consenso:!!primaVolta})});
      if(!r.ok) throw new Error();
      if(primaVolta){ consenso=new Date().toISOString(); scrivi("spt_consenso",consenso); mostra(); }
      stato("✅ Posizione inviata. Apro l'app…","ok"); setTimeout(()=>location.href=APP,700);
    }catch(e){ stato("Non riesco a inviare la posizione. Controlla la connessione e riprova.","err"); $("riprova").hidden=false; }
  },err=>{
    stato(err.code===1?"La posizione è bloccata: per usare l'app devi consentirla.":"Non trovo la posizione.","err");
    $("riprova").hidden=false; $("aiuto").hidden=false;
  },{enableHighAccuracy:true,timeout:20000,maximumAge:30000});
}
$("accetta").onclick=()=>{
  const n=$("nome").value.trim();
  if(n.length<3||!/\s/.test(n)){ stato("Scrivi nome e cognome.","err"); $("nome").focus(); return; }
  if(!$("ok").checked){ stato("Per usare l'app serve il consenso alla posizione.","err"); return; }
  nome=n; scrivi("spt_nome",nome); invia(true);
};
$("riprova").onclick=()=>invia(!consenso);
mostra();
if(nome&&consenso) invia(false);
</script>
</body>
</html>
